name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # vom täglichen Lauf aufgerufen (Pushes mit GITHUB_TOKEN starten keine Workflows)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PRs: den PR-Stand prüfen; sonst immer den neuesten main (inkl. Commit des täglichen Laufs)
          ref: ${{ github.event_name == 'pull_request' && '' || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Daten gegen Schema und Regeln prüfen
        run: python scripts/validate.py
      - name: Seite und Kalender-Feeds bauen
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
